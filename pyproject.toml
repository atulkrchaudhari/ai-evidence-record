[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aer-spec"
version = "0.1.0"
description = "AI Evidence Record (AER): a specification and reference implementation for tamper-evident, hash-chained logs of AI agent decisions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Atul Chaudhari", email = "atul@aipromptshield.com" }]
keywords = ["ai-security", "audit-log", "hash-chain", "eu-ai-act", "ai-governance", "llm", "agents", "tamper-evident"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: System :: Logging",
]
dependencies = []

[project.optional-dependencies]
sign = ["cryptography>=42"]
dev = ["pytest>=8", "ruff>=0.5", "jsonschema>=4.20", "cryptography>=42", "rfc8785>=0.1.4"]

[project.urls]
Homepage = "https://github.com/atulkrchaudhari/ai-evidence-record"
Specification = "https://github.com/atulkrchaudhari/ai-evidence-record/blob/main/SPEC.md"
Issues = "https://github.com/atulkrchaudhari/ai-evidence-record/issues"

[project.scripts]
aer = "aer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
